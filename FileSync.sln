## Hướng dẫn mở cổng firewall (máy Server, PowerShell as Admin)
New-NetFirewallRule -DisplayName "FileSync Server" -Direction Inbound -Protocol TCP -LocalPort 9000 -Action Allow

text
Thay `9000` bằng port thực tế bạn dùng.

## Demo 2 app trên cùng máy (127.0.0.1)

### Chuẩn bị
- Tạo 2 thư mục: `C:\WatchRoot` (nguồn), `C:\ServerRoot` (đích)

### Chạy Server
1. Chạy `build\x64\Release\FileServer.exe`
2. Nhập:
   - Port: `9000`
   - Token: `demo-secret`
   - Root: `C:\ServerRoot` (Browse)
   - Filter: `*`
   - Mode: `Window` → From `00:00` To `00:00` (cả ngày, để sync ngay)
3. Nhấn **Start**
4. UI hiển thị `Status: Running`

### Chạy Client
1. Chạy `build\x64\Release\FileClient.exe`
2. Nhập:
   - Server IP: `127.0.0.1`
   - Port: `9000`
   - Watch: `C:\WatchRoot` (Browse)
   - Token: `demo-secret`
3. Nhấn **Start**
4. UI hiển thị `Status: Connected`

### Kiểm tra
1. Tạo file `C:\WatchRoot\hello.txt` với nội dung "Hello"
2. Đợi ~1-2 giây
3. Kiểm tra `C:\ServerRoot\<hostname-máy-bạn>\hello.txt` → phải khớp nội dung
4. Sửa file → tự đồng bộ lại
5. Đổi tên file → file mới xuất hiện ở server, file cũ giữ nguyên
6. Xóa file ở client → server **KHÔNG** xóa (đúng spec §5), chỉ log phía client
7. Xem log: `server_conn.log` cạnh FileServer.exe; `client_conn.log` cạnh FileClient.exe

### Kịch bản reconnect (test thủ công)
1. Khi cả 2 đang chạy, bấm **Stop** ở Server
2. Client hiển thị `Reconnecting (backoff)...`
3. Tạo thêm file ở client
4. Bấm **Start** lại Server (cùng port, token)
5. Client tự kết nối lại, gửi các file tồn đọng → server nhận đủ

## Giới hạn đã biết (tham chiếu ARCHITECT.md §14 + REVIEW.md)
- **L1:** Không có TLS — token + dữ liệu truyền dạng rõ trên TCP. Chỉ dùng LAN tin cậy.
- **L2:** Token so sánh constant-time nhưng vẫn có thể bị offline brute-force nếu lộ file cấu hình.
- **L7:** Không có versioning/conflict — đồng bộ 1 chiều Client→Server, ghi đè file đích.
- **L9:** Chỉ đồng bộ nội dung + mtime; không ACL/attributes/ADS.
- **Empty dirs không sync** (REVIEW L2).
- **File cùng size sửa nội dung (chưa có event Modified):** initial snapshot có thể bỏ sót (REVIEW L6).
- **Copy-to-tmp O(size)** mỗi lần sync (REVIEW M1) — với file lớn, CPU/IO tăng tương ứng kích thước.
- **`ServerEngine::OnSessionDead` không được gọi tự động** (REVIEW M2) — sessions_ tích tụ nhẹ cho đến lần scheduler tick.

